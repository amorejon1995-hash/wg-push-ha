name: 'WG Push (Surfshark)'
description: 'Túnel WireGuard de ruta partida SOLO hacia el servicio de empuje de notificaciones de HA (mobile-apps.home-assistant.io) y a los registros de imágenes ghcr.io, con salvaguardas para Tailscale y Cloudflare, con interruptor de hombre muerto: si Home Assistant deja de renovar el latido, el túnel se tumba solo y la caja vuelve a su salida directa de siempre. No toca la ruta por defecto ni ningún otro tráfico.'
version: '1.1.1'
image: 'ttl.sh/305fd07f-0b13-4951-8236-816121e5d3d9'
slug: 'wg_push'
init: false
arch:
  - amd64
startup: 'application'
boot: 'manual'
host_network: true
hassio_api: true
homeassistant_api: true
privileged:
  - NET_ADMIN
  map:
    - share:rw
options:
  private_key: ''
  peer_public_key: ''
  endpoint_host: ''
  endpoint_port: 51820
  interface_address: ''
  push_host: 'mobile-apps.home-assistant.io'
  deadman_ttl_s: 300
  arranque_gracia_s: 180
  registry_hosts_extra: []
schema:
  private_key: password
  peer_public_key: str
  endpoint_host: str
  endpoint_port: int
  interface_address: str
  push_host: str
  deadman_ttl_s: int
  arranque_gracia_s: int
  registry_hosts_extra: [str]
